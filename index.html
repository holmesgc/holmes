<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Schoology</title>
    <style>
        /* Lock root document elements to prevent dragging and double-scrollbars */
        html, body {
            margin: 0 !important;
            padding: 0 !important;
            width: 100% !important;
            height: 100% !important;
            overflow: hidden !important;
            background-color: #1a1a1a; /* Clean dark gray fallback match */
        }

        /* Container scales fluidly against modern device layout systems */
        .chat-app-canvas {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100dvh !important; /* Forces layout calculations around mobile address bars */
            display: block !important;
            z-index: 1 !important;
        }

        /* Destroys hardcoded sizes assigned from original snippet generation settings */
        .minnit-chat-sembed, 
        .minnit-chat-sembed iframe {
            width: 100% !important;
            height: 100% !important;
            border: none !important;
            display: block !important;
            margin: 0 !important;
            padding: 0 !important;
        }

        /* Fades required vendor tags flush cleanly against edge corners */
        .powered-by-minnit {
            position: absolute !important;
            bottom: 4px !important;
            right: 4px !important;
            margin: 0 !important;
            font-size: 8px !important;
            opacity: 0.15 !important;
            z-index: 99999 !important;
            pointer-events: none !important;
        }
        .powered-by-minnit a {
            color: #ffffff !important;
            text-decoration: none !important;
        }
    </style>
</head>
<body>

    <!-- Enclosed Layout Canvas wrapper -->
    <div class="chat-app-canvas">
        
        <!-- Minnit Widget Script Core Extension Engine -->
        <script src="https://organizations.minnit.chat/225952183862980/Main" defer></script>
        
        <!-- Stripped down inline style elements to force native scale framework -->
        <span style="display: none;" 
              class="minnit-chat-sembed" 
              data-chatname="https://organizations.minnit.chat/225952183862980/Main" 
              data-style="width:100%;height:100%;" 
              data-version="1.55">Chat</span>
        
    </div>

</body>
</html>
