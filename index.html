<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Schoology</title>
    
    <link rel="icon" type="image/png" href="https://finalsite.net">
    <link rel="shortcut icon" type="image/png" href="https://finalsite.net">
    <link rel="apple-touch-icon" href="https://finalsite.net">

    <style>
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            background-color: #1a1a1a; -webkit-font-smoothing: antialiased;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        
        /* Master structural column that anchors the layout */
        .main-wrapper { 
            position: relative; 
            width: 100%; 
            height: 100%; 
            display: flex; 
            flex-direction: column; 
        }

        /* Top row chat window footprint */
        .chat-container { 
            width: 100%;
            height: 92%; /* Consumes the upper workspace area */
            position: relative; 
            z-index: 1; 
        }
        .chat-container iframe { width: 100%; height: 100%; border: none; display: block; -webkit-overflow-scrolling: touch; }
        
        /* Secret verification click zone layout */
        .secret-zone { position: absolute; bottom: 0; left: 0; width: 50px; height: 8%; z-index: 105; cursor: pointer; }

        /* The Functional Bottom Bar (Only displays when unlocked) */
        .admin-footer-bar {
            width: 100%;
            height: 8%; /* Placed cleanly beneath the main embed */
            background-color: #252526;
            border-top: 1px solid #3c3c3c;
            display: none; /* Managed explicitly via state mapping */
            align-items: center;
            justify-content: space-between;
            box-sizing: border-box;
            padding: 0 20px;
            z-index: 100;
        }
        .footer-title { color: #e0e0e0; font-size: 14px; font-weight: 600; letter-spacing: 0.5px; }

        .action-btn { 
            background: #d32f2f; color: white; border: none; 
            padding: 8px 20px; border-radius: 6px; font-weight: 600; 
            font-size: 13px; cursor: pointer; transition: background 0.2s;
        }
        .action-btn.updating { background: #ff9800; }

        /* Lockout sheet layout overlays */
        .maintenance-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #000000; color: #ffffff; z-index: 200; display: none;
            flex-direction: column; justify-content: center; align-items: center;
            text-align: center; padding: 20px; box-sizing: border-box;
        }
        .spinner { width: 50px; height: 50px; border: 3px solid #1a1a1a; border-top: 3px solid #0288d1; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 25px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .m-title { font-size: 24px; font-weight: 700; margin-bottom: 10px; letter-spacing: -0.5px; }
        .console {
            width: 100%; max-width: 500px; background: #111; border: 1px solid #222; border-radius: 6px;
            padding: 15px; text-align: left; font-family: 'Courier New', Courier, monospace; font-size: 12px;
            color: #4af626; height: 140px; overflow-y: auto; margin-top: 25px; box-sizing: border-box;
        }
        .line { margin-bottom: 6px; line-height: 1.4; }
    </style>
</head>
<body>

    <!-- Invisible trigger zone located in the lower-left footer segment -->
    <div class="secret-zone" onclick="clickCounter()"></div>

    <div class="main-wrapper" id="app-container">

        <!-- Embedded Workspace Viewport Frame -->
        <div class="chat-container">
            <iframe 
                src="https://minnit.chat" 
                allow="geolocation; microphone; camera; fullscreen"
                sandbox="allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts">
            </iframe>
        </div>

        <!-- System Administration Footer Bar Component -->
        <div class="admin-footer-bar" id="ops-bar">
            <div class="footer-title">Schoology Core Operations Center</div>
            <button class="action-btn" id="update-btn" onclick="toggleGlobalUpdate()">Trigger Global Lockout</button>
        </div>

        <!-- Seamless System Lockout Canvas Overlay -->
        <div class="maintenance-overlay" id="lockout-screen">
            <div class="spinner"></div>
            <div class="m-title">Schoology Core Security Update</div>
            <div id="status-text" style="color: #aaa; max-width: 400px; font-size: 14px; line-height: 1.5;">
                Monitoring network architecture patches...
            </div>
            <div class="console" id="console">
                <div class="line">> Establishing connection matrix...</div>
            </div>
        </div>

    </div>
    <script>
        const KVDB_BUCKET_URL = "https://kvdb.io";
        
        let sessionRole = sessionStorage.getItem('owner_auth') || "user";
        let updateActive = false;
        let clickCount = 0;

        document.title = "Schoology";

        // Display operations tool panel layout row if authenticated
        if (sessionRole === "owner") {
            document.getElementById('ops-bar').style.display = "flex";
            document.querySelector('.chat-container').style.height = "92%";
        } else {
            document.querySelector('.chat-container').style.height = "100%";
        }

        // Secret counter lookup sequence targeting the lower edge zone (Click 5 times)
        function clickCounter() {
            clickCount++;
            if (clickCount >= 5) {
                clickCount = 0;
                let password = prompt("Enter Administrator Access Key:");
                if (password === "admin123") {
                    sessionRole = "owner";
                    sessionStorage.setItem('owner_auth', 'owner');
                    document.getElementById('ops-bar').style.display = "flex";
                    document.querySelector('.chat-container').style.height = "92%";
                }
            }
        }

        function toggleGlobalUpdate() {
            const btn = document.getElementById('update-btn');
            const targetState = !updateActive;

            btn.disabled = true;
            btn.innerText = "Syncing...";

            fetch(`${KVDB_BUCKET_URL}/update_lockout`, {
                method: 'PUT',
                body: targetState.toString()
            })
            .then(() => {
                updateActive = targetState;
                btn.disabled = false;
                if (updateActive) {
                    btn.innerText = "End Lockout Mode";
                    btn.classList.add('updating');
                } else {
                    btn.innerText = "Trigger Global Lockout";
                    btn.classList.remove('updating');
                }
            });
        }

        const loops = [
            "Syncing codebase patches with central GitHub master branch...",
            "Purging older document token caches to optimize system storage...",
            "Enforcing modern SSL parameter controls across layout frames...",
            "Securing iframe borders against external cross-site interception loops...",
            "Applying complete data-leak firewalls to active communication networks..."
        ];

        const consoleLog = document.getElementById('console');
        const statusText = document.getElementById('status-text');
        let logIndex = 0;

        function runRollingLogs() {
            const overlay = document.getElementById('lockout-screen');
            if (overlay && overlay.style.display === "flex") {
                let msg = loops[logIndex % loops.length];
                statusText.innerText = msg;
                let line = document.createElement('div');
                line.className = 'line';
                line.innerText = `> ${msg}`;
                consoleLog.appendChild(line);
                if(consoleLog.childNodes.length > 20) consoleLog.removeChild(consoleLog.firstChild);
                consoleLog.scrollTop = consoleLog.scrollHeight;
                logIndex++;
            }
            setTimeout(runRollingLogs, 4000);
        }
        runRollingLogs();

        // Active tracking data query stream loop
        setInterval(() => {
            fetch(`${KVDB_BUCKET_URL}/update_lockout`)
            .then(res => res.text())
            .then(state => {
                const liveStatus = (state.trim() === 'true');
                const overlay = document.getElementById('lockout-screen');
                
                if (sessionRole === "owner") {
                    updateActive = liveStatus;
                    const btn = document.getElementById('update-btn');
                    if (!btn.disabled) {
                        if (updateActive) {
                            btn.innerText = "End Lockout Mode";
                            btn.classList.add('updating');
                        } else {
                            btn.innerText = "Trigger Global Lockout";
                            btn.classList.remove('updating');
                        }
                    }
                }

                if (liveStatus) {
                    if (sessionRole !== "owner") {
                        overlay.style.display = "flex";
                    }
                } else {
                    overlay.style.display = "none";
                }
            })
            .catch(err => console.log("Sync issue tracking log:", err));
        }, 2000);
    </script>
</body>
</html>
